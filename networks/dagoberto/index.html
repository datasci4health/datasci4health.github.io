<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network & Chart Visualizer</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; height: 100vh;
            background-color: #f4f4f9;
        }
        #sidebar {
            width: 380px; padding: 20px;
            background-color: #ffffff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 15px;
            overflow-y: auto; z-index: 10;
        }
        #main-content { flex-grow: 1; position: relative; display: flex; flex-direction: column; }
        #cy-container, #chart-container {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; background-color: #eef2f5;
        }
        #chart-container { display: none; padding: 20px; box-sizing: border-box; background-color: #ffffff; }
        #cy { width: 100%; height: 100%; }
        
        h2, h3 { margin: 0 0 10px 0; color: #333; }
        .input-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        label { font-weight: bold; font-size: 0.9em; color: #555; }
        
        textarea {
            width: 100%; height: 80px; resize: vertical;
            font-family: monospace; box-sizing: border-box;
            padding: 8px; border: 1px solid #ccc; border-radius: 4px;
            margin-bottom: 5px; transition: all 0.2s ease;
        }
        textarea.drag-over { background-color: #e2eef9; border: 2px dashed #0056b3; outline: none; }
        
        .select-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; background: #f9f9f9; padding: 8px; border-radius: 4px; border: 1px solid #eee; }
        .select-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; }
        select { padding: 4px; border-radius: 4px; border: 1px solid #ccc; width: 150px; }

        button {
            background-color: #0056b3; color: white; border: none;
            padding: 10px; cursor: pointer; border-radius: 4px;
            font-weight: bold; transition: background 0.2s;
        }
        button:hover { background-color: #004494; }
        button.alt-btn { background-color: #17a2b8; }
        button.alt-btn:hover { background-color: #138496; }
        .small-btn { padding: 4px 8px; font-size: 0.8em; background-color: #28a745; }
        .small-btn:hover { background-color: #218838; }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .button-group button { flex: 1; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Data Setup</h2>

        <div>
            <div class="input-header">
                <label>Nodes CSV (Need 'id')</label>
                <button class="small-btn" onclick="downloadCSV('nodes-csv', 'nodes.csv')">Save CSV</button>
            </div>
            <textarea id="nodes-csv" placeholder="id,x,y,type,score" oninput="updateDropdowns()"></textarea>
            
            <div class="select-group">
                <div class="select-row">
                    <span>Type Col (Shape/Color):</span>
                    <select id="node-type-sel"><option value="">-- None --</option></select>
                </div>
                <div class="select-row">
                    <span>Numeric Color Col (Overrides):</span>
                    <select id="node-color-sel"><option value="">-- None --</option></select>
                </div>
            </div>
        </div>

        <div>
            <div class="input-header">
                <label>Edges CSV (Need 'source', 'target')</label>
                <button class="small-btn" onclick="downloadCSV('edges-csv', 'edges.csv')">Save CSV</button>
            </div>
            <textarea id="edges-csv" placeholder="source,target,type,strength" oninput="updateDropdowns()"></textarea>

            <div class="select-group">
                <div class="select-row">
                    <span>Type Col (Line Style):</span>
                    <select id="edge-type-sel"><option value="">-- None --</option></select>
                </div>
                <div class="select-row">
                    <span>Thickness Col (Numeric):</span>
                    <select id="edge-width-sel"><option value="">-- None --</option></select>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button onclick="renderNetwork()">Render Network</button>
            <button class="alt-btn" onclick="renderChart()">Plot Nodes Chart</button>
        </div>

        <hr>

        <h3>Actions</h3>
        <div class="button-group">
            <button onclick="saveSetup()">Save JSON</button>
            <button onclick="document.getElementById('load-setup-file').click()">Load JSON</button>
            <input type="file" id="load-setup-file" accept=".json" style="display: none" onchange="loadSetup(event)" />
        </div>
        <div class="button-group" style="margin-top: 10px;">
            <button onclick="downloadImage()">Download View Image</button>
        </div>
    </div>

    <div id="main-content">
        <div id="cy-container"><div id="cy"></div></div>
        <div id="chart-container"><canvas id="myChart"></canvas></div>
    </div>

    <script>
        let cy = null;
        let myChart = null;

        // Visual Palettes
        const categoryColors = ['#3cb44b', '#e6194B', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4'];
        const shapes = ['ellipse', 'rectangle', 'triangle', 'diamond', 'pentagon', 'hexagon'];
        const lineStyles = ['solid', 'dashed', 'dotted'];

        // Sample Data with new numeric columns
        document.getElementById('nodes-csv').value = `id,x,y,type,score\nAlice,10,20,Person,8.5\nBob,15,25,Person,-10\nCharlie,20,15,Person,0\nAcmeCorp,30,10,Company,3.2\nGlobex,40,12,Company,-4.5`;
        document.getElementById('edges-csv').value = `source,target,type,strength\nAlice,AcmeCorp,WorksFor,10\nBob,AcmeCorp,WorksFor,5\nCharlie,Globex,WorksFor,8\nAlice,Bob,Knows,2\nBob,Charlie,Knows,1`;

        // --- Dropdown Management ---
        function getCsvHeaders(csvStr) {
            const parsed = Papa.parse(csvStr, { preview: 1, header: true });
            return parsed.meta.fields || [];
        }

        function populateSelect(selectId, headers, defaultMatch) {
            const sel = document.getElementById(selectId);
            const currentVal = sel.value || defaultMatch;
            sel.innerHTML = '<option value="">-- None --</option>';
            headers.forEach(h => {
                const opt = document.createElement('option');
                opt.value = h; opt.textContent = h;
                if (h === currentVal) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        function updateDropdowns() {
            const nHeaders = getCsvHeaders(document.getElementById('nodes-csv').value);
            const eHeaders = getCsvHeaders(document.getElementById('edges-csv').value);
            
            populateSelect('node-type-sel', nHeaders, 'type');
            populateSelect('node-color-sel', nHeaders, 'score');
            populateSelect('edge-type-sel', eHeaders, 'type');
            populateSelect('edge-width-sel', eHeaders, 'strength');
        }

        // --- Math & Color Interpolation ---
        // Maps value to a Divergent Scale: Red (-1) -> Gray (0) -> Blue (+1)
        function getDivergentColor(val, maxAbs) {
            if (isNaN(val) || maxAbs === 0) return 'rgb(180, 180, 180)'; // Gray fallback
            let norm = Math.max(-1, Math.min(1, val / maxAbs));
            
            let r = 180, g = 180, b = 180;
            if (norm < 0) {
                // Towards Red: Increase R, Decrease G and B
                let intensity = -norm;
                r = Math.round(180 + (255 - 180) * intensity);
                g = Math.round(180 * (1 - intensity));
                b = Math.round(180 * (1 - intensity));
            } else if (norm > 0) {
                // Towards Blue: Increase B, Decrease R and G
                let intensity = norm;
                r = Math.round(180 * (1 - intensity));
                g = Math.round(180 * (1 - intensity));
                b = Math.round(180 + (255 - 180) * intensity);
            }
            return `rgb(${r},${g},${b})`;
        }

        // --- Core Rendering Logic ---
        function renderNetwork() {
            showView('network');
            const nodesCsv = document.getElementById('nodes-csv').value;
            const edgesCsv = document.getElementById('edges-csv').value;
            if (!nodesCsv.trim() || !edgesCsv.trim()) { alert("Please provide data."); return; }

            const nodesData = Papa.parse(nodesCsv, { header: true, skipEmptyLines: true }).data;
            const edgesData = Papa.parse(edgesCsv, { header: true, skipEmptyLines: true }).data;

            // Read Selected Columns
            const nTypeCol = document.getElementById('node-type-sel').value;
            const nColorCol = document.getElementById('node-color-sel').value;
            const eTypeCol = document.getElementById('edge-type-sel').value;
            const eWidthCol = document.getElementById('edge-width-sel').value;

            // 1. Pre-process Nodes
            let nodeTypes = nTypeCol ? [...new Set(nodesData.map(n => n[nTypeCol]).filter(Boolean))] : [];
            let maxAbsNodeColor = 0;
            
            if (nColorCol) {
                nodesData.forEach(n => {
                    let val = parseFloat(n[nColorCol]);
                    if (!isNaN(val) && Math.abs(val) > maxAbsNodeColor) maxAbsNodeColor = Math.abs(val);
                });
            }

            let elements = [];
            nodesData.forEach(n => {
                let keys = Object.keys(n);
                if(keys.length === 0) return;
                n.id = n.id || n[keys[0]]; // Fallback id

                // Compute Category Properties
                let catIndex = nTypeCol ? nodeTypes.indexOf(n[nTypeCol]) : 0;
                n._shape = nTypeCol && catIndex >= 0 ? shapes[catIndex % shapes.length] : 'ellipse';
                let catColor = nTypeCol && catIndex >= 0 ? categoryColors[catIndex % categoryColors.length] : '#888';

                // Compute Final Color
                if (nColorCol) {
                    n._color = getDivergentColor(parseFloat(n[nColorCol]), maxAbsNodeColor);
                } else {
                    n._color = catColor;
                }

                elements.push({ data: n });
            });

            // 2. Pre-process Edges
            let edgeTypes = eTypeCol ? [...new Set(edgesData.map(e => e[eTypeCol]).filter(Boolean))] : [];
            let minEdgeWidth = Infinity, maxEdgeWidth = -Infinity;
            
            if (eWidthCol) {
                edgesData.forEach(e => {
                    let val = parseFloat(e[eWidthCol]);
                    if (!isNaN(val)) {
                        if (val < minEdgeWidth) minEdgeWidth = val;
                        if (val > maxEdgeWidth) maxEdgeWidth = val;
                    }
                });
            }

            edgesData.forEach(e => {
                if(!e.source || !e.target) return;

                // Compute Category Properties
                let catIndex = eTypeCol ? edgeTypes.indexOf(e[eTypeCol]) : 0;
                e._style = eTypeCol && catIndex >= 0 ? lineStyles[catIndex % lineStyles.length] : 'solid';
                e._color = eTypeCol && catIndex >= 0 ? categoryColors[(catIndex + 3) % categoryColors.length] : '#999';
                e._typeLabel = eTypeCol ? e[eTypeCol] : '';

                // Compute Thickness
                e._width = 2; // default
                if (eWidthCol && maxEdgeWidth !== -Infinity) {
                    let val = parseFloat(e[eWidthCol]);
                    if (!isNaN(val)) {
                        let norm = maxEdgeWidth === minEdgeWidth ? 1 : (val - minEdgeWidth) / (maxEdgeWidth - minEdgeWidth);
                        e._width = 1 + (norm * 9); // Scale 1px to 10px
                    }
                }
                elements.push({ data: e });
            });

            // 3. Initialize Cytoscape
            if (cy) cy.destroy();
            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(id)', 'text-valign': 'center', 'text-halign': 'center',
                            'color': '#fff', 'text-outline-width': 2, 'text-outline-color': '#333',
                            'width': 50, 'height': 50,
                            'background-color': 'data(_color)', // Data-driven mapping
                            'shape': 'data(_shape)'            // Data-driven mapping
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'label': 'data(_typeLabel)', 'curve-style': 'bezier', 'target-arrow-shape': 'triangle',
                            'font-size': 10, 'text-background-opacity': 1, 'text-background-color': '#eef2f5',
                            'line-color': 'data(_color)',         // Data-driven mapping
                            'target-arrow-color': 'data(_color)', // Data-driven mapping
                            'line-style': 'data(_style)',         // Data-driven mapping
                            'width': 'data(_width)'               // Data-driven mapping
                        }
                    }
                ],
                layout: { name: 'cose', padding: 50, animate: true }
            });
        }

        // --- Other Utilities (Chart, Save/Load, Setup) ---
        function showView(view) {
            document.getElementById('cy-container').style.display = view === 'network' ? 'block' : 'none';
            document.getElementById('chart-container').style.display = view === 'chart' ? 'block' : 'none';
        }

        function renderChart() {
            showView('chart');
            const nodesCsv = document.getElementById('nodes-csv').value;
            const parsed = Papa.parse(nodesCsv, { header: true, skipEmptyLines: true });
            const headers = parsed.meta.fields;
            if (headers.length < 3) { alert("Chart requires at least 3 columns (Label, X, Y)."); return; }

            const labelCol = headers[0], xCol = headers[1], yCol = headers[2], typeCol = headers[3];
            const groupedData = {};
            
            parsed.data.forEach(row => {
                let cat = (typeCol && row[typeCol]) ? row[typeCol] : 'Points';
                if (!groupedData[cat]) groupedData[cat] = { label: cat, data: [], pointLabels: [], pointRadius: 6, pointHoverRadius: 8 };
                let xVal = parseFloat(row[xCol]), yVal = parseFloat(row[yCol]);
                if(!isNaN(xVal) && !isNaN(yVal)) {
                    groupedData[cat].data.push({ x: xVal, y: yVal });
                    groupedData[cat].pointLabels.push(row[labelCol]); 
                }
            });

            const chartDatasets = Object.keys(groupedData).map((catName, index) => {
                let ds = groupedData[catName];
                ds.backgroundColor = categoryColors[index % categoryColors.length];
                return ds;
            });

            if (myChart) myChart.destroy();
            myChart = new Chart(document.getElementById('myChart').getContext('2d'), {
                type: 'scatter',
                data: { datasets: chartDatasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Nodes Cartesian Plot' },
                        tooltip: { callbacks: { label: ctx => `${ctx.dataset.pointLabels[ctx.dataIndex]}: (${ctx.parsed.x}, ${ctx.parsed.y})` } }
                    },
                    scales: {
                        x: { title: { display: true, text: xCol, font: { weight: 'bold' } } },
                        y: { title: { display: true, text: yCol, font: { weight: 'bold' } } }
                    }
                }
            });
        }

        function setupDragDrop(txtId) {
            const txt = document.getElementById(txtId);
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => txt.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false));
            ['dragenter', 'dragover'].forEach(evt => txt.addEventListener(evt, () => txt.classList.add('drag-over'), false));
            ['dragleave', 'drop'].forEach(evt => txt.addEventListener(evt, () => txt.classList.remove('drag-over'), false));
            txt.addEventListener('drop', e => {
                if (e.dataTransfer.files.length > 0) {
                    const r = new FileReader();
                    r.onload = evt => { txt.value = evt.target.result; updateDropdowns(); };
                    r.readAsText(e.dataTransfer.files[0]);
                }
            });
        }
        setupDragDrop('nodes-csv'); setupDragDrop('edges-csv');

        function downloadCSV(txtId, fName) {
            const content = document.getElementById(txtId).value;
            if (!content.trim()) return;
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([content], { type: 'text/csv' }));
            a.download = fName; a.click();
        }

        function saveSetup() {
            const setup = { nodes: document.getElementById('nodes-csv').value, edges: document.getElementById('edges-csv').value };
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(setup));
            a.download = "setup.json"; a.click();
        }

        function loadSetup(event) {
            if (!event.target.files[0]) return;
            const r = new FileReader();
            r.onload = function(e) {
                try {
                    const setup = JSON.parse(e.target.result);
                    document.getElementById('nodes-csv').value = setup.nodes || "";
                    document.getElementById('edges-csv').value = setup.edges || "";
                    updateDropdowns(); renderNetwork();
                } catch (err) { alert("Invalid JSON file."); }
            };
            r.readAsText(event.target.files[0]);
        }

        function downloadImage() {
            const a = document.createElement('a');
            if (document.getElementById('cy-container').style.display !== 'none') {
                if (!cy) return;
                a.href = cy.png({ bg: '#eef2f5', full: true, scale: 2 });
                a.download = "network.png";
            } else {
                if (!myChart) return;
                a.href = myChart.toBase64Image();
                a.download = "chart.png";
            }
            a.click();
        }

        // Initialize App
        window.onload = () => { updateDropdowns(); renderNetwork(); };
    </script>
</body>
</html>
