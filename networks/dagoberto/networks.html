<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Visualizer</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f4f4f9;
        }
        #sidebar {
            width: 350px;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }
        #main-content {
            flex-grow: 1;
            position: relative;
        }
        #cy {
            width: 100%;
            height: 100%;
            background-color: #eef2f5;
        }
        h2, h3 { margin: 0 0 10px 0; color: #333; }
        
        /* Input Section Styling */
        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        label { font-weight: bold; font-size: 0.9em; color: #555; }
        .file-input { margin-bottom: 5px; font-size: 0.85em; }
        
        textarea {
            width: 100%;
            height: 100px;
            resize: vertical;
            font-family: monospace;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        /* Drag and drop visual feedback */
        textarea.drag-over {
            background-color: #e2eef9;
            border: 2px dashed #0056b3;
            outline: none;
        }

        /* Buttons */
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #004494; }
        .small-btn {
            padding: 4px 8px;
            font-size: 0.8em;
            background-color: #28a745;
        }
        .small-btn:hover { background-color: #218838; }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .button-group button { flex: 1; }
        
        hr { border: 0; border-top: 1px solid #ddd; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Network Setup</h2>

        <div>
            <div class="input-header">
                <label>Nodes CSV (needs 'id', 'type')</label>
                <button class="small-btn" onclick="downloadCSV('nodes-csv', 'nodes.csv')">Save CSV</button>
            </div>
            <input type="file" id="nodes-file" class="file-input" accept=".csv" />
            <textarea id="nodes-csv" placeholder="Drop CSV file here or type...&#10;id,type,label"></textarea>
        </div>

        <div>
            <div class="input-header">
                <label>Edges CSV (needs 'source', 'target', 'type')</label>
                <button class="small-btn" onclick="downloadCSV('edges-csv', 'edges.csv')">Save CSV</button>
            </div>
            <input type="file" id="edges-file" class="file-input" accept=".csv" />
            <textarea id="edges-csv" placeholder="Drop CSV file here or type...&#10;source,target,type"></textarea>
        </div>

        <button onclick="renderNetwork()">Render Network</button>

        <hr>

        <h3>Actions</h3>
        <div class="button-group">
            <button onclick="saveSetup()">Save JSON</button>
            <button onclick="document.getElementById('load-setup-file').click()">Load JSON</button>
            <input type="file" id="load-setup-file" accept=".json" style="display: none" onchange="loadSetup(event)" />
        </div>
        <div class="button-group" style="margin-top: 10px;">
            <button onclick="downloadImage()">Download Graph Image</button>
        </div>
    </div>

    <div id="main-content">
        <div id="cy"></div>
    </div>

    <script>
        let cy = null;

        // --- Visual Palettes ---
        const colors = ['#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4'];
        const shapes = ['ellipse', 'rectangle', 'triangle', 'diamond', 'pentagon', 'hexagon', 'heptagon', 'star'];
        const lineStyles = ['solid', 'dashed', 'dotted'];

        // --- Sample Data Injection ---
        document.getElementById('nodes-csv').value = `id,type\nAlice,Person\nBob,Person\nCharlie,Person\nAcmeCorp,Company\nGlobex,Company`;
        document.getElementById('edges-csv').value = `source,target,type\nAlice,AcmeCorp,WorksFor\nBob,AcmeCorp,WorksFor\nCharlie,Globex,WorksFor\nAlice,Bob,Knows\nBob,Charlie,Knows`;

        // --- File Input Handlers ---
        function setupFileReader(inputId, textareaId) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(textareaId).value = e.target.result;
                };
                reader.readAsText(file);
            });
        }
        setupFileReader('nodes-file', 'nodes-csv');
        setupFileReader('edges-file', 'edges-csv');

        // --- Drag and Drop Handlers ---
        function setupDragAndDrop(textareaId) {
            const textarea = document.getElementById(textareaId);

            // Prevent default browser behavior (opening the file)
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                textarea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // Add/remove visual feedback class
            ['dragenter', 'dragover'].forEach(eventName => {
                textarea.addEventListener(eventName, () => textarea.classList.add('drag-over'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                textarea.addEventListener(eventName, () => textarea.classList.remove('drag-over'), false);
            });

            // Handle the dropped file
            textarea.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                
                if (files && files.length > 0) {
                    const file = files[0];
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        textarea.value = e.target.result;
                    };
                    reader.readAsText(file);
                }
            });
        }
        setupDragAndDrop('nodes-csv');
        setupDragAndDrop('edges-csv');

        // --- CSV Download ---
        function downloadCSV(textareaId, defaultFilename) {
            const csvContent = document.getElementById(textareaId).value;
            if (!csvContent.trim()) {
                alert("The text box is empty. Nothing to save.");
                return;
            }
            
            // Create a Blob containing the CSV data
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            // Create a temporary anchor element and trigger download
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", defaultFilename);
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url); // Clean up
        }

        // --- Network Rendering ---
        function renderNetwork() {
            const nodesCsv = document.getElementById('nodes-csv').value;
            const edgesCsv = document.getElementById('edges-csv').value;

            if (!nodesCsv.trim() || !edgesCsv.trim()) {
                alert("Please provide both Nodes and Edges CSV data.");
                return;
            }

            const nodesData = Papa.parse(nodesCsv, { header: true, skipEmptyLines: true }).data;
            const edgesData = Papa.parse(edgesCsv, { header: true, skipEmptyLines: true }).data;

            let nodeTypes = [...new Set(nodesData.map(n => n.type))];
            let edgeTypes = [...new Set(edgesData.map(e => e.type))];

            let style = [
                {
                    selector: 'node',
                    style: {
                        'label': 'data(id)',
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'color': '#fff',
                        'text-outline-width': 2,
                        'text-outline-color': '#333',
                        'width': 50,
                        'height': 50
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'label': 'data(type)',
                        'curve-style': 'bezier',
                        'target-arrow-shape': 'triangle',
                        'font-size': 10,
                        'text-background-opacity': 1,
                        'text-background-color': '#eef2f5'
                    }
                }
            ];

            nodeTypes.forEach((type, index) => {
                style.push({
                    selector: `node[type = "${type}"]`,
                    style: {
                        'background-color': colors[index % colors.length],
                        'shape': shapes[index % shapes.length]
                    }
                });
            });

            edgeTypes.forEach((type, index) => {
                style.push({
                    selector: `edge[type = "${type}"]`,
                    style: {
                        'line-color': colors[(index + 3) % colors.length],
                        'target-arrow-color': colors[(index + 3) % colors.length],
                        'line-style': lineStyles[index % lineStyles.length]
                    }
                });
            });

            let elements = [];
            nodesData.forEach(n => {
                if(n.id) elements.push({ data: n });
            });
            edgesData.forEach(e => {
                if(e.source && e.target) elements.push({ data: e });
            });

            if (cy) { cy.destroy(); }
            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                style: style,
                layout: {
                    name: 'cose',
                    padding: 50,
                    animate: true
                }
            });
        }

        // --- Save / Load Full Setup ---
        function saveSetup() {
            const setup = {
                nodes: document.getElementById('nodes-csv').value,
                edges: document.getElementById('edges-csv').value
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(setup));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "network_setup.json");
            dlAnchorElem.click();
        }

        function loadSetup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const setup = JSON.parse(e.target.result);
                    document.getElementById('nodes-csv').value = setup.nodes || "";
                    document.getElementById('edges-csv').value = setup.edges || "";
                    renderNetwork();
                } catch (err) {
                    alert("Invalid JSON file.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // --- Download Image ---
        function downloadImage() {
            if (!cy) {
                alert("Please render a network first.");
                return;
            }
            const png64 = cy.png({ bg: '#eef2f5', full: true, scale: 2 });
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", png64);
            dlAnchorElem.setAttribute("download", "network_graph.png");
            dlAnchorElem.click();
        }

        // Render default network on load
        window.onload = renderNetwork;
    </script>
</body>
</html>
