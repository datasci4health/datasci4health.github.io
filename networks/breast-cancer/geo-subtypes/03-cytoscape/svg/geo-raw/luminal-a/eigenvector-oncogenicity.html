<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Comparison</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }

    .container {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .svg-wrapper {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      flex: 1;
      max-width: 45%;
    }

    .svg-wrapper h2 {
      margin-top: 0;
      text-align: center;
      color: #333;
    }

    object,
    svg {
      width: 100%;
      height: 600px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <script>
    function initPanZoom(el) {
      if (!el.panZoomInit) {
        el.panZoomInit = true;
        svgPanZoom(el, {
          zoomEnabled: true,
          controlIconsEnabled: true,
          fit: true,
          center: true,
          minZoom: 0.1,
          maxZoom: 20
        });
      }
    }
  </script>
</head>

<body>
  <h1 style="text-align: center;">Luminal A</h1>
  <div class="container">
    <div class="svg-wrapper">
      <h2>Expression (color) and Eigenvector (size)</h2>
      <object data="expression-eigenvector.svg" type="image/svg+xml" onload="initPanZoom(this)"></object>
    </div>
    <div class="svg-wrapper">
      <h2>Expression (color) and Oncogenicity (size)</h2>
      <object data="expression-oncogenicity.svg" type="image/svg+xml" onload="initPanZoom(this)"></object>
    </div>
  </div>
</body>

</html>
